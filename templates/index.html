<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>LeetCode Analytics</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #f5f5f5;
    }

    .container {
        background: white;
        padding: 40px;
        width: 400px;
        max-width: 90%;

        text-align: center;

        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
        margin-bottom: 10px;
    }

    p {
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        text-align: left;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        box-sizing: border-box;

        padding: 12px;
        margin-bottom: 20px;

        border: 1px solid #ccc;
        border-radius: 6px;

        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 6px;

        background-color: #333;
        color: white;

        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #555;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>LeetCode Analytics</h1>

    <p>
        Enter your LeetCode username to view your problem-solving
        statistics and progress.
    </p>

    <form action="/analytics" method="GET">

        <label for="username">LeetCode Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="e.g. abcd1234"
            required
        >

        <button type="submit">
            View Analytics
        </button>

    </form>

</div>
```

</body>
</html>
