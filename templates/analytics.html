<h1>LeetCode Analytics</h1>

<p>Easy solved: {{ difficulty["Easy"] }}</p>
<p>Medium solved: {{ difficulty["Medium"] }}</p>
<p>Hard solved: {{ difficulty["Hard"] }}</p>

<canvas id="difficultyChart"></canvas>

<script>
    const difficulty = {{ difficulty | tojson }};

    new Chart(
        document.getElementById("difficultyChart"),
        {
            type: "bar",
            data: {
                labels: Object.keys(difficulty),
                datasets: [{
                    data: Object.values(difficulty)
                }]
            }
        }
    );
</script>
